# 風格／知識來源（粵語評馬人）
# PUBLIC 倉：全文入 ingestion/private/（gitignore）；只 commit 知識摘要 + ≤200字 excerpt + profiles
# 見 docs/style-exemplars.md

- id: style-horsetrio
  name: HorseTrio 賽前分析／戰報／識馬學堂
  type: web_crawl
  enabled: true
  url: https://horsetrio.com/
  schedule: "0 2 * * *"
  priority: 4
  domain_tags: [horse_racing, style, knowledge, commentary, cantonese]
  config:
    purpose: style
    commentator: horsetrio
    delay_seconds: 2.2
    max_items: 80
    max_chars: 14000
    respect_robots: true
    listing_urls:
      - https://horsetrio.com/posts
      - https://horsetrio.com/sitemap.xml
    seed_urls:
      - https://horsetrio.com/learn/1
      - https://horsetrio.com/learn/2
      - https://horsetrio.com/learn/3
      - https://horsetrio.com/study/1
      - https://horsetrio.com/study/2
  notes: |
    公開可讀。sitemap 有逐場 /posts/MTG_*/r/N 同 learn/study。
    歷史深度視 sitemap（目前約兩週賽日 + 學堂文）。用 scripts/crawl_style_sources.py 做增量。

- id: style-hkdn-racing
  name: 新報馬頁 HKDN Racing（馬場教父等公開新聞）
  type: web_crawl
  enabled: true
  url: https://hkdnracing.com/zh
  schedule: "30 2 * * *"
  priority: 4
  domain_tags: [horse_racing, style, knowledge, commentary, cantonese]
  config:
    purpose: style
    commentator: hkdn-教父
    delay_seconds: 2.2
    max_items: 40
    respect_robots: true
    listing_urls:
      - https://hkdnracing.com/zh/news
      - https://hkdnracing.com/zh
    seed_urls: []
  notes: |
    /zh/news 公開新聞可讀。hkdnform.com/zh/tips 偏會員／動態，唔自動爬貼士牆。

- id: style-oncc-racing
  name: 東網馬經 racing.on.cc（晨操／名家推介）
  type: web_crawl
  enabled: true
  url: https://racing.on.cc/
  schedule: "0 1 * * 0,3"  # 賽日前朝（日／三近似）
  priority: 5
  domain_tags: [horse_racing, style, knowledge, commentary, cantonese]
  config:
    purpose: style
    commentator: oncc-馬經
    delay_seconds: 2.5
    max_items: 20
    respect_robots: true
    seed_urls:
      - https://racing.on.cc/
      - https://racing.on.cc/racing/mor/current/rjmora0001x0.html
      - https://racing.on.cc/racing/mor/current/rjmorb0001x0.html
      - https://racing.on.cc/racing/mor/current/rjmorc0001x0.html
      - https://racing.on.cc/racing/fav/current/rjfavg0001x0.html
  notes: |
    robots 允許一般 UA。頁面 Big5。深層歷史 archive URL 不穩定，以 current + 增量為主。

