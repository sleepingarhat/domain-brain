[project]
name = "domain-brain"
version = "0.2.0"
description = "天喜腦 TianxiBrain — productizable domain AI brain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sleepingarhat" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1.0"]
dev = ["ruff>=0.6"]

[project.scripts]
domain-brain-run = "ingestion.cli:main"
tianxi-brain = "brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "connectors*", "agents*", "brain*"]
