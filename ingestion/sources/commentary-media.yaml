# 香港賽馬評論／媒體來源
# 規則：免費公開可讀 + 有穩定更新 → enabled: true 並可入每日 GHA
# 付費牆／403／紙本為主 → enabled: false

- id: hkjc-news
  name: 香港賽馬會公開賽馬資訊與新聞
  type: web_crawl
  enabled: true
  url: https://racing.hkjc.com/
  schedule: "30 17 * * *"
  priority: 2
  domain_tags: [horse_racing, official, hkjc, free]
  config:
    delay_seconds: 1.5
    max_chars: 12000
    seed_urls:
      - https://racing.hkjc.com/zh-hk/local/information/localresults
      - https://racingnews.hkjc.com/chinese/
      - https://racingnews.hkjc.com/english/
  notes: |
    免費公開。賽日更新賽果／排位；racingnews 近乎日更新聞。
    已驗證 HTTP 200。適合每日自動爬。

- id: idol-horse
  name: Idol Horse 賽馬專題／專欄
  type: web_crawl
  enabled: true
  url: https://idolhorse.com/
  schedule: "30 17 * * *"
  priority: 3
  domain_tags: [horse_racing, commentary, free]
  config:
    delay_seconds: 2.0
    max_chars: 14000
    seed_urls:
      - https://idolhorse.com/
      - https://idolhorse.com/zh-hant/
  notes: |
    文章公開可讀（HTTP 200）。非嚴格「每日必更」，但賽季期間高頻更新。
    適合每日自動爬首頁／中文首頁作新文發現。

- id: the-standard-inside-track
  name: The Standard Hong Kong Racing / INSIDE TRACK
  type: web_crawl
  enabled: true
  url: https://www.thestandard.com.hk/hong-kong-racing
  schedule: "30 17 * * *"
  priority: 3
  domain_tags: [horse_racing, commentary, english, free-partial]
  config:
    delay_seconds: 2.0
    max_chars: 12000
    seed_urls:
      - https://www.thestandard.com.hk/hong-kong-racing
  notes: |
    列表頁公開（HTTP 200）。部分深度文或有訂閱提示；爬取失敗會記 partial。
    更新偏專欄節奏，非每日必更，仍可每日嘗試。

- id: stheadline-racing-tips
  name: 星島／頭條 賽馬名家專欄
  type: web_crawl
  enabled: false
  url: https://www.stheadline.com/racing-tips
  priority: 4
  domain_tags: [horse_racing, commentary]
  config:
    seed_urls:
      - https://www.stheadline.com/racing-tips
  notes: 有公開列表，但專欄版權／商業限制高，暫不自動爬。

- id: hkdn-racing
  name: HKDN Racing 專家心水
