name: Build Brain Index

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Refresh tianxi-database sample
        run: python -m ingestion.cli --source tianxi-database --lookback-days 40 --max-days 3
        continue-on-error: true
      - name: Refresh tianxi-api
        run: python -m ingestion.cli --source tianxi-api
        continue-on-error: true
      - name: compile wiki
        run: python -m brain.cli compile
        continue-on-error: true
      - name: reflect completed meetings
        run: python -m brain.cli reflect --lookback-days 5 --max-days 2
        continue-on-error: true
      - name: brain.cli build
        run: python -m brain.cli build
      - name: lint wiki
        run: python -m brain.cli lint
        continue-on-error: true
      - name: golden eval
        run: python -m brain.cli eval
      - name: Upload index
        uses: actions/upload-artifact@v4
        with:
          name: brain-index-${{ github.run_id }}
          path: |
            brain/index/
            wiki/
            ingestion/chunks/
            ingestion/metrics/
          if-no-files-found: warn
          retention-days: 14
