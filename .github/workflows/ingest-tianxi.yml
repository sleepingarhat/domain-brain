name: Ingest tianxi-database

on:
  schedule:
    # 每天 01:30 HKT ≈ 17:30 UTC（賽日後數據大致齊）
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run tianxi-database connector
        run: |
          python -m ingestion.cli --source tianxi-database --lookback-days 14 --max-days 5

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-output
          path: |
            ingestion/runs/
            ingestion/chunks/
            ingestion/metrics/
          if-no-files-found: warn
