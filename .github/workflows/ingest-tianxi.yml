name: TianxiBrain daily ingest + index

on:
  schedule:
    # 每天 01:30 HKT ≈ 17:30 UTC
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Ingest tianxi-database
        run: |
          python -m ingestion.cli --source tianxi-database --lookback-days 40 --max-days 5

      - name: Ingest tianxi-api
        run: |
          python -m ingestion.cli --source tianxi-api
        continue-on-error: true

      # 免費 + 有更新節奏的評論／官方源
      - name: Crawl HKJC public news/results
        run: python -m ingestion.cli --source hkjc-news
        continue-on-error: true

      - name: Crawl Idol Horse
        run: python -m ingestion.cli --source idol-horse
        continue-on-error: true

      - name: Crawl The Standard HK racing
        run: python -m ingestion.cli --source the-standard-inside-track
        continue-on-error: true

      - name: Build local BM25 index
        run: |
          python -m brain.cli build

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tianxi-brain-${{ github.run_id }}
          path: |
            ingestion/runs/
            ingestion/chunks/
            ingestion/metrics/
            brain/index/
          if-no-files-found: warn
          retention-days: 14
